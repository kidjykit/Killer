name = "killer-game"
main = "src/worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# build ตัว UI ลง dist/ ให้อัตโนมัติก่อนเสมอ ทั้งตอน deploy และตอน wrangler dev
# กัน error 'The directory specified by the "assets.directory" field ... does not exist'
# เวลารัน `wrangler deploy` ตรง ๆ หรือเวลา Cloudflare Workers Builds รัน deploy ให้โดยไม่ได้ตั้ง build command
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
# SPA: ทุกเส้นทางที่ไม่ใช่ไฟล์จริงให้คืน index.html (ไม่งั้น /offline จะถูก redirect กลับ /)
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

# SQLite-backed Durable Objects — ใช้ได้ทั้งแผนฟรีและแผนเสียเงิน
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]
